<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Operation Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
  .chart-container {
    height: 400px;
    width: 100%;
    padding: 20px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    background: #fff;
    border-radius: 10px;
  }

  canvas {
    width: 90% !important;
    height: 90% !important;
  }

  
    h2 {
      font-weight: 600;
      margin-bottom: 30px;
      color: #343a40;
    }
  
    .nav-tabs .nav-link.active {
      background-color: #007bff;
      color: white;
      font-weight: bold;
    }
  
    .nav-tabs .nav-link {
      color: #007bff;
    }
  
   
  
    .chart-container h3 {
      font-size: 20px;
      margin-bottom: 20px;
      color: #495057;
    }
  
    
  
    .row {
      margin-top: 30px;
    }
  
    .dropdown-menu a:hover {
      background-color: #007bff;
      color: white;
    }
  </style>
  
</head>
<body class="p-4">

  <h2>Operation Dashboard</h2>

  <!-- Navigation with dropdown -->
  <ul class="nav nav-tabs" id="dashboardTabs" role="tablist">
    
    <!-- Product Management with Dropdown -->
    <li class="nav-item dropdown">
      <a class="nav-link dropdown-toggle active" id="productTab" data-toggle="dropdown" href="#" role="button" aria-haspopup="true" aria-expanded="false">
        Product Management
      </a>
      <div class="dropdown-menu" aria-labelledby="productTab">
        <a class="dropdown-item" href="view.html">View Products</a>
        <a class="dropdown-item" href="input-product.html">Add Product</a>
      </div>
    </li>

    <!-- Sale Management -->
    <li class="nav-item">
      <a class="nav-link" href="boughtproduct.html">Sale Management</a>
    </li>

    <!-- Answer Query -->
    <li class="nav-item">
      <a class="nav-link" href="adminquery.html">Answer Query</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="income_statement.html">income-Statement</a>
    </li>
  </ul>


  <div class="container mt-4">
    <div class="row">
      <div class="col-md-6">
        <div class="chart-container">
          <h3>Net Profit Over Time</h3>
          <canvas id="netProfitChart"></canvas>
        </div>
      </div>
      <div class="col-md-6">
        <div class="chart-container">
          <h3>Expense Breakdown</h3>
          <canvas id="expenseBreakdownChart"></canvas>
        </div>
      </div>
    </div>
  </div>
  

  <!-- Bootstrap JS and jQuery -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAz2fsTVC7zZE1ZAw7lToe3wdScAMKzTYo",
      authDomain: "iwb-iwc.firebaseapp.com",
      projectId: "iwb-iwc",
      storageBucket: "iwb-iwc.appspot.com",
      messagingSenderId: "520008388872",
      appId: "1:520008388872:web:3bfa0fe02638de36961cbd"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Load payment and revenue data
    async function loadDashboardData() {
      const snapshot = await getDocs(collection(db, "payments"));

      const paymentMethods = {};
      const monthlyRevenue = {};

      snapshot.forEach(doc => {
        const data = doc.data();
        const method = data.paymentMethod || "Other";
        const amount = parseFloat(data.totalPrice || 0);
        const date = data.date || new Date().toISOString();
        const month = new Date(date).toLocaleString('default', { month: 'short', year: 'numeric' });

        paymentMethods[method] = (paymentMethods[method] || 0) + 1;
        monthlyRevenue[month] = (monthlyRevenue[month] || 0) + amount;
      });

      renderPaymentMethodChart(paymentMethods);
      renderMonthlyRevenueChart(monthlyRevenue);
    }

    // Load net profit and expenses from expenseReports
    async function loadExtraCharts() {
      const snapshot = await getDocs(collection(db, "expenseReports"));
      const netProfitData = [];
      const netProfitLabels = [];
      const expenseTotals = { capital: 0, salaries: 0, transport: 0, advertising: 0, bills: 0 };

      snapshot.forEach(doc => {
        const data = doc.data();
        const createdAt = data.createdAt?.toDate?.() || new Date(data.createdAt);
        const label = new Date(createdAt).toLocaleDateString();

        netProfitLabels.push(label);
        netProfitData.push(data.netProfit || 0);

        expenseTotals.capital += data.capital || 0;
        expenseTotals.salaries += data.salaries || 0;
        expenseTotals.transport += data.transport || 0;
        expenseTotals.advertising += data.advertising || 0;
        expenseTotals.bills += data.bills || 0;
      });

      renderNetProfitChart(netProfitLabels, netProfitData);
      renderExpenseBreakdownChart(expenseTotals);
    }

    function renderPaymentMethodChart(data) {
      const ctx = document.getElementById('paymentMethodChart').getContext('2d');
      new Chart(ctx, {
        type: 'pie',
        data: {
          labels: Object.keys(data),
          datasets: [{
            data: Object.values(data),
            backgroundColor: ['#007bff', '#28a745', '#ffc107', '#dc3545', '#6c757d']
          }]
        },
        options: {
          responsive: true,
          aspectRatio: 1
        }
      });
    }

    function renderMonthlyRevenueChart(data) {
      const ctx = document.getElementById('monthlyRevenueChart').getContext('2d');
      const labels = Object.keys(data).sort((a, b) => new Date('1 ' + a) - new Date('1 ' + b));
      const values = labels.map(label => data[label]);

      new Chart(ctx, {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            label: 'Revenue ($)',
            data: values,
            backgroundColor: '#17a2b8'
          }]
        },
        options: {
          responsive: true,
          aspectRatio: 1,
          scales: {
            y: { beginAtZero: true }
          }
        }
      });
    }

    function renderNetProfitChart(labels, data) {
      const ctx = document.getElementById('netProfitChart').getContext('2d');
      new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'Net Profit ($)',
            data,
            borderColor: '#28a745',
            fill: false,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          scales: {
            y: { beginAtZero: true }
          }
        }
      });
    }

    function renderExpenseBreakdownChart(expenses) {
      const ctx = document.getElementById('expenseBreakdownChart').getContext('2d');
      new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: Object.keys(expenses),
          datasets: [{
            data: Object.values(expenses),
            backgroundColor: ['#007bff', '#28a745', '#ffc107', '#dc3545', '#6c757d']
          }]
        },
        options: {
          responsive: true
        }
      });
    }

    loadDashboardData();
    loadExtraCharts();
  </script>
</body>
</html>
