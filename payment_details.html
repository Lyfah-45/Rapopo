<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payments Summary</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="p-4">
  <div class="container">
    <h2 class="mb-4">Payments Summary</h2>

    <table class="table table-bordered" id="paymentTable">
      <thead class="thead-dark">
        <tr>
          <th>Card Name</th>
          <th>Card Number</th>
          <th>Expiry Date</th>
          <th>CVV</th>
          <th>Email</th>
          <th>Address</th>
          <th>Payment Method</th>
          <th>Total Price ($)</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>

    <div class="mt-4">
      <h5><strong>Total Revenue:</strong> $<span id="totalRevenue">0.00</span></h5>
    </div>

    <div class="mt-3">
      <button class="btn btn-success" onclick="exportToExcel()">Export to Excel</button>
      <button class="btn btn-danger" onclick="exportToPDF()">Export to PDF</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import {
      getFirestore,
      collection,
      getDocs
    } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAz2fsTVC7zZE1ZAw7lToe3wdScAMKzTYo",
      authDomain: "iwb-iwc.firebaseapp.com",
      projectId: "iwb-iwc",
      storageBucket: "iwb-iwc.appspot.com",
      messagingSenderId: "520008388872",
      appId: "1:520008388872:web:3bfa0fe02638de36961cbd"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.loadPayments = async function () {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      let totalRevenue = 0;
      const snapshot = await getDocs(collection(db, "payments"));

      snapshot.forEach((doc) => {
        const d = doc.data();
        const amount = parseFloat(d.totalPrice) || 0;
        totalRevenue += amount;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${d.cardName || ''}</td>
          <td>${d.cardNumber || ''}</td>
          <td>${d.expiryDate || ''}</td>
          <td>${d.cvv || ''}</td>
          <td>${d.billingEmail || ''}</td>
          <td>${d.billingAddress || ''}</td>
          <td>${d.paymentMethod || ''}</td>
          <td>${amount.toFixed(2)}</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById("totalRevenue").textContent = totalRevenue.toFixed(2);
    };

    window.exportToExcel = function () {
      const table = document.getElementById("paymentTable");
      const wb = XLSX.utils.table_to_book(table, { sheet: "Payments" });
      XLSX.writeFile(wb, "payments.xlsx");
    };

    window.exportToPDF = function () {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.text("Payments Summary", 14, 16);
      doc.autoTable({ html: "#paymentTable", startY: 22 });
      doc.save("payments.pdf");
    };

    // Auto-load payments when page loads
    window.addEventListener("DOMContentLoaded", loadPayments);
  </script>
</body>
</html>
