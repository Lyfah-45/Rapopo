<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product List</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <style>
    img { width: 60px; height: auto; }
    .modal img { width: 100px; }
    .table-wrapper { overflow-x: auto; }
  </style>
</head>
<body class="p-4">

  <h2 class="mb-4">Product List</h2>

  <!-- Filter and Export Buttons -->
  <div class="mb-3 d-flex justify-content-between">
    <select id="categoryFilter" class="form-control w-25">
      <option value="">All Categories</option>
    </select>
    <div>
      <button class="btn btn-success mr-2" onclick="exportToExcel()">Export to Excel</button>
      <button class="btn btn-danger" onclick="exportToPDF()">Export to PDF</button>
    </div>
  </div>

  <div class="table-wrapper">
    <table class="table table-bordered" id="productTable">
      <thead class="thead-light">
        <tr>
          <th>Name</th>
          <th>Category</th>
          <th>Image</th>
          <th>Old Price</th>
          <th>Price</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Edit Modal -->
  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="editForm">
          <div class="modal-header">
            <h5>Edit Product</h5>
            <button type="button" class="close" data-dismiss="modal">&times;</button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="productId">
            <div class="form-group"><label>Name</label><input type="text" id="editName" class="form-control" required></div>
            <div class="form-group"><label>Category</label><input type="text" id="editCategory" class="form-control" required></div>
            <div class="form-group"><label>Image URL</label><input type="text" id="editImageUrl" class="form-control" required></div>
            <div class="form-group"><label>Old Price</label><input type="number" id="editOldPrice" class="form-control" required></div>
            <div class="form-group"><label>Price</label><input type="number" id="editPrice" class="form-control" required></div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-primary" type="submit">Update</button>
            <button class="btn btn-secondary" data-dismiss="modal">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Firebase & App Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAz2fsTVC7zZE1ZAw7lToe3wdScAMKzTYo",
      authDomain: "iwb-iwc.firebaseapp.com",
      projectId: "iwb-iwc",
      storageBucket: "iwb-iwc.appspot.com",
      messagingSenderId: "520008388872",
      appId: "1:520008388872:web:3bfa0fe02638de36961cbd"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const tableBody = document.querySelector("#productTable tbody");
    const categoryFilter = document.getElementById("categoryFilter");

    let allProducts = [];

    async function loadProducts() {
      const querySnapshot = await getDocs(collection(db, "products"));
      allProducts = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

      populateCategoryFilter();
      displayProducts();
    }

    function populateCategoryFilter() {
      const categories = [...new Set(allProducts.map(p => p.category))];
      categoryFilter.innerHTML = `<option value="">All Categories</option>` + categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
    }

    function displayProducts() {
      const selectedCategory = categoryFilter.value;
      const filtered = selectedCategory ? allProducts.filter(p => p.category === selectedCategory) : allProducts;

      tableBody.innerHTML = "";
      filtered.forEach(data => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${data.name}</td>
          <td>${data.category}</td>
          <td><img src="${data.imageUrl}" alt="Product Image" /></td>
          <td>${data.oldPrice}</td>
          <td>${data.price}</td>
          <td>
            <button class="btn btn-sm btn-primary editBtn" data-id="${data.id}">Edit</button>
            <button class="btn btn-sm btn-danger deleteBtn" data-id="${data.id}">Delete</button>
          </td>
        `;
        tableBody.appendChild(tr);
      });

      document.querySelectorAll(".editBtn").forEach(btn => {
        btn.addEventListener("click", () => openEditModal(btn.dataset.id));
      });

      document.querySelectorAll(".deleteBtn").forEach(btn => {
        btn.addEventListener("click", () => deleteProduct(btn.dataset.id));
      });
    }

    async function openEditModal(id) {
      const product = allProducts.find(p => p.id === id);
      if (!product) return;

      document.getElementById("productId").value = id;
      document.getElementById("editName").value = product.name;
      document.getElementById("editCategory").value = product.category;
      document.getElementById("editImageUrl").value = product.imageUrl;
      document.getElementById("editOldPrice").value = product.oldPrice;
      document.getElementById("editPrice").value = product.price;

      $('#editModal').modal('show');
    }

    async function deleteProduct(id) {
      if (confirm("Are you sure you want to delete this product?")) {
        await deleteDoc(doc(db, "products", id));
        alert("Product deleted!");
        loadProducts();
      }
    }

    document.getElementById("editForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("productId").value;
      await updateDoc(doc(db, "products", id), {
        name: document.getElementById("editName").value,
        category: document.getElementById("editCategory").value,
        imageUrl: document.getElementById("editImageUrl").value,
        oldPrice: Number(document.getElementById("editOldPrice").value),
        price: Number(document.getElementById("editPrice").value)
      });
      $('#editModal').modal('hide');
      alert("Product updated!");
      loadProducts();
    });

    categoryFilter.addEventListener("change", displayProducts);

    // Export Functions
    window.exportToExcel = () => {
      let table = document.getElementById("productTable").outerHTML;
      let uri = 'data:application/vnd.ms-excel,' + encodeURIComponent(table);
      let link = document.createElement("a");
      link.href = uri;
      link.download = "products.xls";
      link.click();
    }

    window.exportToPDF = () => {
      import("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js").then(jsPDFModule => {
        const { jsPDF } = jsPDFModule;
        const doc = new jsPDF();
        doc.text("Product List", 14, 16);
        let rows = [];
        document.querySelectorAll("#productTable tbody tr").forEach(tr => {
          const cells = tr.querySelectorAll("td");
          rows.push([cells[0].innerText, cells[1].innerText, cells[3].innerText, cells[4].innerText]);
        });
        doc.autoTable({
          head: [["Name", "Category", "Old Price", "Price"]],
          body: rows,
          startY: 20
        });
        doc.save("products.pdf");
      });
    }

    loadProducts();
  </script>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

</body>
</html>
