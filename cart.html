<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Cart</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
  <style>
    body { padding: 20px; }
    .cart-table img { width: 60px; height: auto; }
    .total-price { font-size: 20px; font-weight: bold; margin-top: 20px; }
    .btn-proceed { margin-top: 20px; font-size: 18px; }
  </style>
</head>
<body>

  <h2>Your Shopping Cart</h2>
  <div class="table-responsive">
    <table class="table cart-table">
      <thead class="thead-dark">
        <tr>
          <th>Image</th>
          <th>Name</th>
          <th>Price</th>
          <th>Qty</th>
          <th>Subtotal</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="cart-body">
        <!-- Items will be injected here -->
      </tbody>
    </table>
  </div>

  <div class="total-price" id="totalPrice">Total: $0.00</div>

  <div class="btn-proceed">
    <button id="proceedBtn" class="btn btn-primary">Proceed to Payment</button>
  </div>

  <!-- Firebase SDK + Firestore (module) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import {
      getFirestore,
      collection,
      getDocs,
      deleteDoc,
      doc
    } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyAz2fsTVC7zZE1ZAw7lToe3wdScAMKzTYo",
      authDomain: "iwb-iwc.firebaseapp.com",
      projectId: "iwb-iwc",
      storageBucket: "iwb-iwc.appspot.com",
      messagingSenderId: "520008388872",
      appId: "1:520008388872:web:3bfa0fe02638de36961cbd"
    };

    // Init
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Load cart from Firestore
    window.loadCart = async function() {
      const cartRef = collection(db, "cart");
      const snapshot = await getDocs(cartRef);
      const cartBody = document.getElementById("cart-body");
      const totalPriceDiv = document.getElementById("totalPrice");
      cartBody.innerHTML = "";
      let total = 0;

      snapshot.forEach(docSnap => {
        const item = docSnap.data();
        const subtotal = item.price * item.qty;
        total += subtotal;

        cartBody.innerHTML += `
          <tr>
            <td><img src="${item.imageUrl}" alt="${item.name}"></td>
            <td>${item.name}</td>
            <td>$${item.price.toFixed(2)}</td>
            <td>${item.qty}</td>
            <td>$${subtotal.toFixed(2)}</td>
            <td>
              <button class="btn btn-danger btn-sm" onclick="removeItem('${docSnap.id}')">
                Remove
              </button>
            </td>
          </tr>
        `;
      });

      totalPriceDiv.textContent = `Total: $${total.toFixed(2)}`;
    };

    // Remove one item
    window.removeItem = async function(id) {
      await deleteDoc(doc(db, "cart", id));
      loadCart();
    };

    // Initial load
    loadCart();
  </script>

  <!-- Plain Script for Proceed Button -->
  <script>
    document.getElementById("proceedBtn").addEventListener("click", function() {
      // Clear the table and total (UI only)
      document.getElementById("cart-body").innerHTML = "";
      document.getElementById("totalPrice").textContent = "Total: $0.00";

      // Navigate to payment page
      window.location.href = "checkout.html";
    });
  </script>

</body>
</html>
