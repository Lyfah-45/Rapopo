  <!-- Firebase + Payment Handling -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
    import {
      getFirestore, collection, getDocs, addDoc,
      deleteDoc, doc
    } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAz2fsTVC7zZE1ZAw7lToe3wdScAMKzTYo",
      authDomain: "iwb-iwc.firebaseapp.com",
      projectId: "iwb-iwc",
      storageBucket: "iwb-iwc.appspot.com",
      messagingSenderId: "520008388872",
      appId: "1:520008388872:web:3bfa0fe02638de36961cbd"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function updateOrderSummary() {
      const listEl = document.getElementById("product-list");
      const totalEl = document.getElementById("total-price");
      listEl.innerHTML = "";
      let total = 0;

      const snapshot = await getDocs(collection(db, "cart"));
      const items = [];

      snapshot.forEach(doc => {
        const item = doc.data();
        item.id = doc.id;
        const subtotal = item.price * item.qty;
        total += subtotal;
        items.push(item);

        const row = document.createElement("div");
        row.className = "d-flex justify-content-between";
        row.innerHTML = `<span>${item.name} (x${item.qty})</span><span>$${subtotal.toFixed(2)}</span>`;
        listEl.appendChild(row);
      });

      totalEl.textContent = `$${total.toFixed(2)}`;
      return { total, items };
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const { total, items } = await updateOrderSummary();

      document.getElementById("payment-form").onsubmit = async e => {
        e.preventDefault();

        const paymentData = {
          cardName: document.getElementById("card-name").value,
          cardNumber: document.getElementById("card-number").value,
          expiryDate: document.getElementById("expiry-date").value,
          cvv: document.getElementById("cvv").value,
          paymentMethod: document.getElementById("payment-method").value,
          billingAddress: document.getElementById("billing-address").value,
          billingEmail: document.getElementById("billing-email").value,
          totalPrice: total,
          items
        };

        try {
          await addDoc(collection(db, "payments"), paymentData);

          for (const item of items) {
            await addDoc(collection(db, "boughtProducts"), {
              name: item.name,
              qty: item.qty,
              price: item.price,
              subtotal: item.qty * item.price,
              purchasedAt: new Date().toISOString(),
              buyerEmail: paymentData.billingEmail
            });
          }

          const cartSnapshot = await getDocs(collection(db, "cart"));
          for (const cartDoc of cartSnapshot.docs) {
            await deleteDoc(doc(db, "cart", cartDoc.id));
          }

          const { jsPDF } = window.jspdf;
          const docPDF = new jsPDF();
          docPDF.text("Purchase Receipt", 14, 20);
          docPDF.text(`Name: ${paymentData.cardName}`, 14, 30);
          docPDF.text(`Email: ${paymentData.billingEmail}`, 14, 36);
          docPDF.text("Items Purchased:", 14, 48);

          const tableData = paymentData.items.map(i => [
            i.name, i.qty, `$${i.price.toFixed(2)}`, `$${(i.qty * i.price).toFixed(2)}`
          ]);

          docPDF.autoTable({
            head: [['Name', 'Qty', 'Price', 'Subtotal']],
            body: tableData,
            startY: 55
          });

          docPDF.text(`Total: $${total.toFixed(2)}`, 14, docPDF.lastAutoTable.finalY + 10);
          docPDF.save("receipt.pdf");

          localStorage.setItem("receiptName", paymentData.cardName);
          window.location.href = "thankyou.html";

        } catch (err) {
          console.error(err);
          alert("Error processing payment.");
        }
      };
    });
	// Newsletter Form
	const newsletterForm = document.getElementById("newsletter-form");
      newsletterForm?.addEventListener("submit", async function (e) {
        e.preventDefault();
        const emailInput = document.getElementById("newsletter-email");
        const email = emailInput.value.trim();
  
        if (email) {

            } else {
              await addDoc(newsletterRef, {
                email: email,
                subscribedAt: serverTimestamp()
              });
              alert("Thank you for subscribing!");
              emailInput.value = "";
            }
          } catch (error) {
            console.error("Newsletter error:", error);
            alert("An error occurred. Please try again.");
          }
        }
      });
  </script>
