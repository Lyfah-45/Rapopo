<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Finance Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="p-4">
  <div class="container">
    <h2 class="mb-4 text-center">📊 Finance Dashboard</h2>

    <!-- Navigation Tabs -->
    <ul class="nav nav-pills justify-content-center mb-4">
      <li class="nav-item">
        <a class="nav-link" href="boughtproduct.html">Products Bought</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="view.html">Product Available</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="payment_details.html">Payments Summary</a>
      </li>
    </ul>

    <!-- Chart Section -->
    <div class="card">
      <div class="card-body">
        <h5 class="card-title text-center">Top 5 Most Sold Products</h5>
        <canvas id="productChart" height="100"></canvas>
      </div>
    </div>
  </div>

  <!-- Firebase and Chart Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAz2fsTVC7zZE1ZAw7lToe3wdScAMKzTYo",
      authDomain: "iwb-iwc.firebaseapp.com",
      projectId: "iwb-iwc",
      storageBucket: "iwb-iwc.appspot.com",
      messagingSenderId: "520008388872",
      appId: "1:520008388872:web:3bfa0fe02638de36961cbd"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function fetchAndChart() {
      const snapshot = await getDocs(collection(db, "boughtProducts"));
      const data = snapshot.docs.map(doc => doc.data());

      // Count quantity by product name
      const productCounts = {};
      data.forEach(p => {
        productCounts[p.name] = (productCounts[p.name] || 0) + p.qty;
      });

      // Get top 5 products
      const sorted = Object.entries(productCounts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5);

      const labels = sorted.map(item => item[0]);
      const quantities = sorted.map(item => item[1]);

      // Render Chart
      const ctx = document.getElementById('productChart').getContext('2d');
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Units Sold',
            data: quantities,
            backgroundColor: 'rgba(54, 162, 235, 0.6)',
            borderColor: 'rgba(54, 162, 235, 1)',
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          scales: {
            y: {
              beginAtZero: true,
              stepSize: 1
            }
          }
        }
      });
    }

    fetchAndChart();
  </script>

  <!-- Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
