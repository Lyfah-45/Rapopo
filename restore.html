<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Restore Backup</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
  <h3>♻️ Restore Firestore Backup</h3>

  <input type="file" id="jsonFile" accept=".json" class="form-control mb-3">
  <button id="restoreBtn" class="btn btn-primary">Restore Backup</button>
  <div id="status" class="mt-3"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAz2fsTVC7zZE1ZAw7lToe3wdScAMKzTYo",
      authDomain: "iwb-iwc.firebaseapp.com",
      projectId: "iwb-iwc",
      storageBucket: "iwb-iwc.appspot.com",
      messagingSenderId: "520008388872",
      appId: "1:520008388872:web:3bfa0fe02638de36961cbd"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById("restoreBtn").addEventListener("click", () => {
      const fileInput = document.getElementById("jsonFile");
      const statusDiv = document.getElementById("status");

      if (!fileInput.files.length) {
        statusDiv.innerHTML = `<div class="alert alert-warning">Please choose a .json file</div>`;
        return;
      }

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = async (e) => {
        try {
          const data = JSON.parse(e.target.result);
          let total = 0;

          for (const [collectionName, docs] of Object.entries(data)) {
            for (const item of docs) {
              const { id, ...fields } = item;
              await setDoc(doc(db, collectionName, id), fields);
              total++;
            }
          }

          statusDiv.innerHTML = `<div class="alert alert-success">${total} documents restored!</div>`;
        } catch (err) {
          console.error(err);
          statusDiv.innerHTML = `<div class="alert alert-danger">Restore failed. Invalid file format.</div>`;
        }
      };

      reader.readAsText(file);
    });
  </script>
</body>
</html>
